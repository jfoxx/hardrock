<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Promo Picker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://use.typekit.net/uma8ayv.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: adobe-clean, sans-serif;
      background: #f5f5f5;
      padding: 12px;
      color: #323232;
    }

    .promo-picker {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .promo-search {
      width: 100%;
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
      border: 1px solid #d3d3d3;
      border-radius: 4px;
      color: #323232;
    }

    .promo-search:focus {
      outline: none;
      border-color: #0265dc;
      box-shadow: 0 0 0 1px #0265dc;
    }

    .promo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .promo-card {
      display: flex;
      flex-direction: column;
      text-align: left;
      background: #fff;
      border: 1px solid #d3d3d3;
      border-radius: 4px;
      overflow: hidden;
      padding: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .promo-card:hover,
    .promo-card:focus-visible {
      outline: none;
      border-color: #0265dc;
      box-shadow: 0 0 0 1px #0265dc;
    }

    .promo-card-media {
      display: block;
      aspect-ratio: 3 / 2;
      background: #ececec;
    }

    .promo-card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .promo-card-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 12px 12px;
    }

    .promo-card-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
    }

    .promo-card-code {
      align-self: flex-start;
      padding: 2px 8px;
      border-radius: 3px;
      background: #e6ecff;
      color: #0054b6;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .feedback {
      text-align: center;
      font-size: 12px;
      color: #6e6e6e;
      min-height: 16px;
    }

    .feedback.success { color: #0d7d0d; }
    .feedback.error { color: #d31510; }
  </style>
</head>
<body>
  <div class="promo-picker">
    <input type="search" class="promo-search" id="promo-search" placeholder="Search promos…" autocomplete="off">
    <div class="promo-grid" id="promo-grid"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <script type="module" src="promo-picker.js"></script>
</body>
</html>
